[project]
name = "ai-tamperguard-v1"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
    "httpx",
    "jsonschema",
    "langgraph",
    "langsmith",
    "openai",
    "pydantic>=2",
    "pydantic-settings",
    "pytest",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
